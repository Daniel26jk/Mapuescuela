<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mapuescuela | Acceso administración</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <aside class="estandarte estandarte-izquierdo">
        <div class="estandarte-negro"></div>
        <div class="estandarte-azul"></div>
        <div class="estandarte-verde"></div>
        <div class="estandarte-rojo"></div>
        <div class="estandarte-negro"></div>
    </aside>

    <aside class="estandarte estandarte-derecho">
        <div class="estandarte-negro"></div>
        <div class="estandarte-azul"></div>
        <div class="estandarte-verde"></div>
        <div class="estandarte-rojo"></div>
        <div class="estandarte-negro"></div>
    </aside>

    <header class="encabezado">

        <div class="franja-colores">
            <span class="color-negro"></span>
            <span class="color-azul"></span>
            <span class="color-verde"></span>
            <span class="color-rojo"></span>
        </div>

        <div class="encabezado-contenido">

            <div class="marca">

                <img
                    src="img/logo-mapuescuela.png"
                    alt="Logo Mapuescuela"
                    class="logo-mapuescuela"
                >

                <div class="marca-texto">
                    <h1>Mapuescuela</h1>
                    <p>Acceso administración</p>
                </div>

            </div>

            <div class="estado-sistema">
                <span class="punto-online"></span>
                Acceso restringido
            </div>

        </div>

    </header>

    <main class="contenedor">

        <section class="bienvenida">

            <div>

                <p class="etiqueta-superior">
                    ADMINISTRACIÓN
                </p>

                <h2>
                    Iniciar sesión
                </h2>

                <p>
                    Ingresa tus credenciales para acceder
                    al panel de administración.
                </p>

            </div>

        </section>

        <section class="panel">

            <form id="formLogin">

                <div class="formulario-grid">

                    <div class="campo">

                        <label for="usuario">
                            Usuario
                        </label>

                        <input
                            type="text"
                            id="usuario"
                            autocomplete="username"
                            required
                        >

                    </div>

                    <div class="campo">

                        <label for="password">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="password"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                </div>

                <div class="acciones-formulario">

                    <a
                        href="index.html"
                        class="boton boton-secundario"
                    >
                        Volver al inicio
                    </a>

                    <button
                        type="submit"
                        class="boton boton-principal"
                    >
                        Ingresar
                    </button>

                </div>

            </form>

            <div
                id="mensajeLogin"
                class="mensaje"
            ></div>

        </section>

    </main>

    <footer>

        <strong>
            Mapuescuela
        </strong>

        <span>
            Educa-acción para el buen vivir
        </span>

    </footer>

    <script src="login.js"></script>

</body>

</html>
